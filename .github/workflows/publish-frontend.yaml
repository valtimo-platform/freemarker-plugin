name: Build and publish frontend

on:
  push:
    paths:
      - 'frontend/**'
    branches:
      - v12
      - main

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Using GitHub's API is not supported for push events
  # -------------------------------------------------------------
  #
  # ----------------------------------------------------------------------------------------------
  # Using local .git history
  # ----------------------------------------------------------------------------------------------
  # Event `push`: Compare the preceding remote commit -> to the current commit of the main branch
  # ----------------------------------------------------------------------------------------------
  changed_files:
    runs-on: ubuntu-latest  # windows-latest || macos-latest
    name: Test changed-files
    outputs:
      matrix: ${{ steps.changed-files.outputs.all_changed_files }}
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # OR "2" -> To retrieve the preceding commit.

      - name: Get changed files
        id: changed-files
        with:
          dir_names: 'true'
          dir_names_max_depth: '1'
          matrix: 'true'
          path: 'frontend/projects'
        uses: tj-actions/changed-files@a284dc1814e3fd07f2e34267fc8f81227ed29fb8 # v45.0.9
      # NOTE: `since_last_remote_commit: true` is implied by default and falls back to the previous local commit.

  Build-and-publish:
    if: needs.changed_files.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    needs: changed_files
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        value: ${{ fromJSON(needs.changed_files.outputs.matrix) }}
    name: Build and publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm install
        working-directory: frontend

      - run: npm run build --workspace="projects/$CHANGED_DIR"
        working-directory: frontend
        env:
          CHANGED_DIR: ${{ matrix.value }}

      - name: Publish
        run: |
          PUBLISH_PATH=$(node -e "const p=require('path'); const d=require('./projects/' + process.env.CHANGED_DIR + '/ng-package.json').dest; console.log(p.normalize(p.join('projects', process.env.CHANGED_DIR, d)))")
          # A v12 release must not become the latest version for Valtimo 13 users
          NPM_TAG=$([ "$GITHUB_REF_NAME" = "v12" ] && echo v12 || echo latest)
          npm publish "$PUBLISH_PATH" --access public --tag "$NPM_TAG"
        working-directory: frontend
        env:
          CHANGED_DIR: ${{ matrix.value }}
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_SECRET }}
